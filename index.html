/* ---------- the dog ---------- */

.stage {
  position: relative;
  width: clamp(190px, 52vw, 260px);
  height: clamp(190px, 52vw, 260px);
  animation: sway 4.6s ease-in-out infinite;

.pet { width: 100%; height: 100%; }

@keyframes sway {
  0%, 100% { transform: rotate(-2deg) translateY(0); }
  50%      { transform: rotate(2deg) translateY(-7px); }
}

/* ---------- the waterfall she gets for saying yes ----------
   Sized to the dog's own box, not the whole screen. Three copies of
   a real Lottie waterfall asset (see CREDITS.md), cropped in tight
   and mirrored on alternates, sit over an opaque backdrop so nothing
   shows through. The dog swap happens once it's fully covered. */

.pour {
  position: absolute;
  inset: 0;
  overflow: hidden;
  border-radius: 14%;
  pointer-events: none;
  opacity: 0;
}

.pour.is-on { opacity: 1; }

.pour-art {
  position: absolute;
  left: 0;
  right: 0;
  width: 100%;
  height: 190%;
  top: -200%;
  background: linear-gradient(180deg, var(--water-back) 0%, var(--water-deep) 100%);
}

.pour.is-on .pour-art { animation: pour 1.35s cubic-bezier(.55, 0, .3, 1) forwards; }

@keyframes pour {
  0%   { top: -200%; }
  30%  { top: -8%; }      /* fully covers the dog — the swap happens here */
  62%  { top: -8%; }
  100% { top: 118%; }
}

/* each fall is a cropped, zoomed-in window onto one Lottie instance —
   sized so the crop reads at roughly 1:1 with the dog's own box, even
   though pour-art itself is taller (it needs the extra height to slide) */
.fall {
  position: absolute;
  top: 0;
  height: 52.6316%;
  overflow: hidden;
}

.fall--l { left: -6%;  width: 44%; }
.fall--m { left: 33%;  width: 44%; }
.fall--r { left: 70%;  width: 44%; }

.fall-inner {
  position: absolute;
  width: 1000px;
  height: 1000px;
  transform: scale(2.1) translate(-24%, -4%);
}

.fall-inner--mirror { transform: scale(2.1) translate(18%, -4%) scaleX(-1); }

.fall-inner svg { display: block; }

/* where the water lands — pinned to the bottom of the box, not the
   scrolling artwork, so it reads as a splash rather than scrolling past */
.foam-art {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  width: 100%;
  height: 15%;
  opacity: 0;
}

.pour.is-on .foam-art { animation: foam-flash 1.35s linear forwards; }

@keyframes foam-flash {
  0%, 26%  { opacity: 0; }
  34%, 58% { opacity: 1; }
  68%, 100% { opacity: 0; }
}

.foam { fill: var(--foam); }
.foam-bit { fill: var(--foam); opacity: .9; }

@media (prefers-reduced-motion: no-preference) {
  .pour.is-on .foam-bit { animation: bob-foam 1.1s ease-in-out infinite; }
  .pour.is-on .foam-bit:nth-of-type(2) { animation-delay: -.3s; }
  .pour.is-on .foam-bit:nth-of-type(3) { animation-delay: -.6s; }
}

@keyframes bob-foam {
  0%, 100% { transform: translateY(0); }
  50%      { transform: translateY(-3px); }
}

/* the new dog arrives a touch wet */
.pet.is-fresh { animation: shake-off .7s cubic-bezier(.3, 1.5, .5, 1); }

@keyframes shake-off {
  0%   { transform: scale(.92) translateY(6px); }
  45%  { transform: scale(1.03) rotate(1.5deg); }
  70%  { transform: scale(1) rotate(-1.5deg); }
  100% { transform: scale(1) rotate(0); }
}

.pill--yes {

@keyframes wiggle {

  65%      { transform: rotate(3deg) scale(1.06); }

.pill--no {
  background: var(--card);
  color: var(--accent);
}

.pill--no.is-loose { position: fixed; margin: 0; z-index: 5; }

/* ---------- between questions ---------- */

.page[data-mode="asking"]  .waiting-bits { display: none; }

.waiting-bits {

.link:hover { color: var(--accent-lit); }
.link[disabled] { color: var(--ink-soft); opacity: .55; cursor: default; text-decoration: none; }

:where(button):focus-visible {
  outline: 3px solid var(--pink);

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {

    animation-iteration-count: 1 !important;
    transition-duration: .001ms !important;
  }
  .bubbles, .pour { display: none; }
}

<script>
/* ===========================================================
   Nine dogs — one for every time the question comes back.
   Four of them are golden retrievers; the rest are a mixed pack.

   These are Lottie animations from the LottieFiles free
   library, bundled locally so they keep working with no
   connection and can never 404. See CREDITS.md.

   The hand-drawn cat that started all this is kept in
   cats-drawn.js.bak.
   =========================================================== */

const Dogs = (() => {

  const DOGS = [
    { file: "lottie/1-golden-sitting.json", name: "golden retriever, sitting" },
    { file: "lottie/2-golden-happy.json",   name: "golden, delighted about it" },
    { file: "lottie/3-golden-puppy.json",   name: "golden puppy" },
    { file: "lottie/4-splashing.json",      name: "in the water already" },
    { file: "lottie/5-corgi.json",          name: "corgi, trotting" },
    { file: "lottie/6-shiba.json",          name: "shiba in a bandana" },
    { file: "lottie/7-frenchie.json",       name: "french bulldog" },
    { file: "lottie/8-golden-napping.json", name: "golden, fast asleep" },
    { file: "lottie/9-poodle.json",         name: "poodle puppy" },
  ];

  const wrap = (i) => ((i % DOGS.length) + DOGS.length) % DOGS.length;

  /* One step further round the ring for every glass, offset by the day so
     tomorrow does not open the same way. */
  function indexFor(glassesToday, date = new Date()) {
    const day = Math.floor(date.getTime() / 86400000);
    return wrap(glassesToday + day);
  }

  return {
    count: DOGS.length,
    indexFor,
    file: (i) => DOGS[wrap(i)].file,
    name: (i) => DOGS[wrap(i)].name,
  };
})();

if (typeof module !== "undefined") module.exports = Dogs;

</script>
<script>
/* ===========================================================
   Did you drink water? — shared behaviour for the extension
   and the web app. A host supplies a `store` adapter:

   store = {
     ownsScheduling,          // true when this page must nag by itself
     load(), save(state), subscribe(fn),
     notify(payload),         // optional
     onTick(view),            // optional
   }

   The knobs are right below. Change them here, then run
   `python3 build.py`.
   =========================================================== */

const WaterCheck = (() => {
  const MIN = 60 * 1000;

  const SETTINGS = {
    name: "Karma",
    intervalMinutes: 120,     // how often she gets asked
    goal: 8,                  // glasses in a day
    dayStart: "08:00",        // no asking before this
    dayEnd: "23:00",          // ...or after this
    sound: true,              // a small chime with the pop-up (web app only)
  };

  const NAG_EVERY = 2 * MIN;  // an unanswered pop-up comes back this often
  const PRAISE_MS = 5000;

  const PRAISE = [
    "Good. Now we wait.",
    "That's the one. Thank you.",
    "See? Painless.",
    "Noted. Two hours.",
  ];

  /* ---------- time ---------- */

  const pad = (n) => String(n).padStart(2, "0");

  const dateKey = (d = new Date()) =>
    `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;

  function atTime(base, hhmm) {
    const [h, m] = String(hhmm).split(":").map(Number);
    const d = new Date(base);
    d.setHours(h || 0, m || 0, 0, 0);
    return d.getTime();
  }

  function windowFor(ts, s) {
    const start = atTime(ts, s.dayStart);
    let end = atTime(ts, s.dayEnd);
    if (end <= start) end += 24 * 60 * MIN;   // a day that runs past midnight
    return { start, end };
  }

  function awake(ts, s) {
    const { start, end } = windowFor(ts, s);
    return ts >= start && ts <= end;
  }

  // Never ask while she's asleep — push it to the next waking hour.
  function clampToWindow(ts, s) {
    const { start, end } = windowFor(ts, s);
    if (ts < start) return start;
    if (ts > end) return atTime(ts + 24 * 60 * MIN, s.dayStart);
    return ts;
  }

  const clockTime = (ts) => {
    const d = new Date(ts);
    return `${pad(d.getHours())}:${pad(d.getMinutes())}`;
  };

  function countdown(ms) {
    const total = Math.max(0, Math.round(ms / 1000));
    const h = Math.floor(total / 3600);
    const m = Math.floor((total % 3600) / 60);
    const s = total % 60;
    return h ? `${h}:${pad(m)}:${pad(s)}` : `${m}:${pad(s)}`;
  }

  function gapWords(ms) {
    const mins = Math.round(ms / MIN);
    if (mins < 2) return "a minute";
    if (mins < 60) return `${mins} minutes`;
    const h = Math.floor(mins / 60);
    const rest = mins % 60;
    return rest ? `${h}h ${rest}m` : `${h} hour${h === 1 ? "" : "s"}`;
  }

  /* ---------- state ---------- */

  function normalise(raw) {
    const state = raw && typeof raw === "object" ? raw : {};
    const fresh = !raw || typeof raw.nextDue !== "number";
    state.settings = Object.assign({}, SETTINGS);
    state.log = state.log && typeof state.log === "object" ? state.log : {};
    if (typeof state.pending !== "number") state.pending = null;

    if (fresh) {
      // First run: ask straight away, so she meets a dog instead of a timer.
      const now = Date.now();
      if (awake(now, state.settings)) {
        state.pending = now;
        state.nextDue = now;
      } else {
        state.nextDue = clampToWindow(now, state.settings);
      }
    }
    const keys = Object.keys(state.log).sort();
    while (keys.length > 14) delete state.log[keys.shift()];   // keep a fortnight
    return state;
  }

  const entriesFor = (state, key = dateKey()) =>
    (state.log[key] || []).slice().sort((a, b) => a - b);

  const lastGlass = (state) => {
    const list = entriesFor(state);
    return list.length ? list[list.length - 1] : null;
  };

  /* The only thing that puts the question down. */
  function drink(state, now = Date.now()) {
    const key = dateKey(new Date(now));
    state.log[key] = entriesFor(state, key).concat(now);
    state.pending = null;
    state.nextDue = clampToWindow(now + state.settings.intervalMinutes * MIN, state.settings);
    return state;
  }

  function notificationText(state) {
    const last = lastGlass(state);
    const tail = last
      ? `Last glass at ${clockTime(last)}. Click to answer.`
      : "Nothing logged today. Click to answer.";
    return { title: `Hey ${state.settings.name}.`, body: `Did you drink water?\n${tail}` };
  }

  /* ---------- mount ---------- */

  async function mount(store) {
    const $ = (id) => document.getElementById(id);
    const el = {
      page: $("page"), title: $("title"), sub: $("sub"),
      pet: $("pet"), pour: $("pour"),
      yes: $("yes"), no: $("no"),
      ticks: $("ticks"), clock: $("clock"), log: $("log"), undo: $("undo"),
    };

    let state = normalise(await store.load());

    /* Surfaces you open on purpose ask every single time — opening the link
       is itself the reminder. The extension and the desktop app don't, since
       they do their nagging through pop-ups instead. */
    if (store.askOnOpen && !state.pending && awake(Date.now(), state.settings)) {
      state.pending = Date.now();
      store.save(state);
    }

    let mode = null;
    let lastKey = dateKey();
    let lastNagAt = 0;
    let dodges = 0;
    let praiseUntil = 0;
    let praiseLine = PRAISE[0];
    let audio = null;
    let gladTimer = null;

    /* ---------- a small chime ---------- */

    function unlockAudio() {
      if (audio) { if (audio.state === "suspended") audio.resume(); return; }
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (Ctx) audio = new Ctx();
    }
    document.addEventListener("pointerdown", unlockAudio);

    function chime() {
      if (!state.settings.sound || !audio || audio.state !== "running") return;
      const t0 = audio.currentTime;
      [[880, 0], [660, 0.2]].forEach(([freq, offset]) => {
        const osc = audio.createOscillator();
        const gain = audio.createGain();
        osc.type = "sine";
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.0001, t0 + offset);
        gain.gain.exponentialRampToValueAtTime(0.16, t0 + offset + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, t0 + offset + 0.2);
        osc.connect(gain).connect(audio.destination);
        osc.start(t0 + offset);
        osc.stop(t0 + offset + 0.22);
      });
    }

    /* ---------- the No that will not be caught ---------- */

    function dodge() {
      if (!el.no.classList.contains("is-loose")) {
        const r = el.no.getBoundingClientRect();
        el.no.style.width = `${r.width}px`;
        el.no.style.height = `${r.height}px`;
        el.no.style.left = `${r.left}px`;
        el.no.style.top = `${r.top}px`;
        el.no.classList.add("is-loose");
      }

      dodges += 1;
      const w = el.no.offsetWidth;
      const h = el.no.offsetHeight;
      const maxX = Math.max(8, window.innerWidth - w - 8);
      const maxY = Math.max(8, window.innerHeight - h - 8);
      el.no.style.left = `${8 + Math.random() * (maxX - 8)}px`;
      el.no.style.top = `${8 + Math.random() * (maxY - 8)}px`;

      // Yes gets a little bigger every time she tries.
      const grow = Math.min(dodges, 5);
      el.yes.style.fontSize = `${21 + grow * 2.4}px`;
      el.yes.style.padding = `${15 + grow * 1.6}px ${44 + grow * 4.5}px`;
    }

    function resetNo() {
      dodges = 0;
      el.no.className = "pill pill--no";
      el.no.removeAttribute("style");
      el.yes.removeAttribute("style");
    }

    el.no.addEventListener("mouseover", dodge);
    el.no.addEventListener("pointerdown", (e) => { e.preventDefault(); dodge(); });
    el.no.addEventListener("click", (e) => { e.preventDefault(); dodge(); });
    el.no.addEventListener("touchstart", (e) => { e.preventDefault(); dodge(); }, { passive: false });

    window.addEventListener("resize", () => {
      if (!el.no.classList.contains("is-loose")) return;
      const x = Math.min(parseFloat(el.no.style.left) || 0, window.innerWidth - el.no.offsetWidth - 8);
      const y = Math.min(parseFloat(el.no.style.top) || 0, window.innerHeight - el.no.offsetHeight - 8);
      el.no.style.left = `${Math.max(8, x)}px`;
      el.no.style.top = `${Math.max(8, y)}px`;
    });

    /* ---------- yes ---------- */

    function sayYes() {
      unlockAudio();
      drink(state);
      praiseUntil = Date.now() + PRAISE_MS;
      praiseLine = PRAISE[Math.floor(Math.random() * PRAISE.length)];
      resetNo();
      store.save(state);

      pourWater();
      render();
    }

    el.yes.addEventListener("click", sayYes);
    el.log.addEventListener("click", sayYes);

    el.undo.addEventListener("click", () => {
      const key = dateKey();
      const list = entriesFor(state, key);
      if (!list.length) return;
      list.pop();
      state.log[key] = list;
      store.save(state);
      render();
    });

    /* The three copies of the waterfall asset that make up the pour. Built
       once, lazily, from the same bundled animation — played only while
       she's actually seeing them, paused the rest of the time. */
    let fallPlayers = null;

    function ensureFalls() {
      if (fallPlayers || typeof lottie === "undefined") return fallPlayers;
      const ids = ["fall1", "fall2", "fall3"];
      const containers = ids.map((id) => document.getElementById(id)).filter(Boolean);
      if (containers.length < 3) return null;
      fallPlayers = containers.map((container) =>
        lottie.loadAnimation({
          container, renderer: "svg", loop: true, autoplay: false,
          path: "lottie/pour-waterfall.json",
        }));
      return fallPlayers;
    }

    /* Saying yes tips a sheet of water over her. The swap happens while the
       screen is covered, so the next dog is simply there when it clears. */
    function pourWater() {
      const still = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      if (still || !el.pour) { renderDog(true); return; }

      clearTimeout(gladTimer);
      el.pour.classList.remove("is-on");
      el.pet.classList.remove("is-fresh");
      void el.pour.offsetWidth;                  // restart the animation
      el.pour.classList.add("is-on");

      const falls = ensureFalls();
      if (falls) falls.forEach((p) => p.play());

      setTimeout(() => {                         // hidden under the water
        renderDog(true);
        el.pet.classList.add("is-fresh");
      }, 480);

      gladTimer = setTimeout(() => {
        el.pour.classList.remove("is-on");
        el.pet.classList.remove("is-fresh");
        if (falls) falls.forEach((p) => p.pause());
      }, 1450);
    }

    /* ---------- render ---------- */

    /* A different dog every time the question comes back. */
    let shownDog = -1;

    let player = null;

    function renderDog(force) {
      if (typeof Dogs === "undefined" || typeof lottie === "undefined") return;
      const want = Dogs.indexFor(entriesFor(state).length);
      if (want === shownDog) return;
      shownDog = want;

      const still = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      try {
        if (player) { player.destroy(); player = null; }
        el.pet.textContent = "";
        player = lottie.loadAnimation({
          container: el.pet,
          renderer: "svg",
          loop: true,
          autoplay: !still,
          path: Dogs.file(want),
        });
        // Hold on the first frame for anyone who asked for less movement —
        // but only once the animation is actually loaded.
        if (still) player.addEventListener("DOMLoaded", () => player.goToAndStop(0, true));
      } catch (e) {
        shownDog = -1;          // let the next render try again
      }
    }

    function renderTicks() {
      const count = entriesFor(state).length;
      const total = Math.max(state.settings.goal, count);
      el.ticks.textContent = "";
      for (let i = 0; i < total; i++) {
        const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
        svg.setAttribute("viewBox", "0 0 20 28");
        svg.setAttribute("class", `tick${i < count ? " is-full" : ""}`);
        svg.setAttribute("aria-hidden", "true");
        svg.innerHTML = '<path d="M10 1c0 0 8.6 10.2 8.6 15.4a8.6 8.6 0 0 1-17.2 0C1.4 11.2 10 1 10 1Z" />';
        el.ticks.appendChild(svg);
      }
    }

    function render() {
      const now = Date.now();
      const s = state.settings;
      const count = entriesFor(state).length;
      const next = state.pending ? "asking" : "waiting";

      if (mode !== next) {
        mode = next;
        el.page.dataset.mode = mode;
        if (mode === "asking") {
          resetNo();
          requestAnimationFrame(() => el.yes.focus());
        }
      }

      if (mode === "asking") {
        el.title.textContent = `${s.name}, did you drink water?`;
        const last = lastGlass(state);
        el.sub.textContent = last
          ? `it has been ${gapWords(now - last)} since your last glass.`
          : "nothing logged today yet.";
      } else {
        el.title.textContent = now < praiseUntil
          ? praiseLine
          : count
            ? `${count} of ${s.goal} glasses today`
            : "No water yet today";
        el.sub.textContent = "";
      }

      renderDog();
      renderTicks();
      el.undo.disabled = count === 0;
      tick();
    }

    function tick() {
      const now = Date.now();

      if (dateKey() !== lastKey) { lastKey = dateKey(); render(); return; }

      if (store.ownsScheduling) {
        if (!state.pending && now >= state.nextDue) {
          if (awake(now, state.settings)) {
            state.pending = now;
            lastNagAt = 0;
            store.save(state);
            render();
            return;
          }
          state.nextDue = clampToWindow(now, state.settings);
          store.save(state);
        }
        if (state.pending && now - lastNagAt > NAG_EVERY) {
          lastNagAt = now;
          if (store.notify) store.notify(notificationText(state));
          chime();
        }
      }

      if (mode === "waiting") {
        if (praiseUntil && now > praiseUntil) { praiseUntil = 0; render(); return; }
        const { start } = windowFor(now, state.settings);
        el.clock.innerHTML = `${now < start ? "first check in" : "next check in"} <b></b>`;
        el.clock.querySelector("b").textContent = countdown(state.nextDue - now);
      }

      if (store.onTick) {
        store.onTick({
          mode,
          clock: countdown(state.nextDue - now),
          count: entriesFor(state).length,
          goal: state.settings.goal,
          name: state.settings.name,
        });
      }
    }

    if (store.subscribe) {
      store.subscribe((incoming) => { state = normalise(incoming); render(); });
    }

    render();
    setInterval(tick, 1000);
  }

  return {
    mount, normalise, dateKey, entriesFor, lastGlass, drink,
    clampToWindow, windowFor, awake, notificationText,
    SETTINGS, MIN, NAG_EVERY,
  };
})();

if (typeof module !== "undefined") module.exports = WaterCheck;

</script>

  async load() {
    try { return JSON.parse(localStorage.getItem(KEY) || "null"); }
    catch (e) { return null; }
  },

  async save(state) {
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}

  subscribe(fn) {
    window.addEventListener("storage", (e) => {
      if (e.key !== KEY || !e.newValue) return;
      try { fn(JSON.parse(e.newValue)); } catch (err) {}
    });

  notify({ title, body }) {
    if (!("Notification" in window) || Notification.permission !== "granted") return;
    const note = new Notification(title, {
      body,
      icon: ICON,
      tag: "water-check",
      renotify: true,
      requireInteraction: true,

    note.onclick = () => { window.focus(); note.close(); };

  /* The tab title keeps asking too, in case the pop-up gets buried. */

      document.title = flash ? "DID YOU DRINK WATER?" : "· · ·";

      document.title = `${view.clock} · ${view.count}/${view.goal} glasses`;

/* Installable when served over http(s); harmless when opened as a file. */

document.addEventListener("pointerdown", () => {
  if ("Notification" in window && Notification.permission === "default") {
    Notification.requestPermission();
  }
}, { once: true });

WaterCheck.mount(store);
